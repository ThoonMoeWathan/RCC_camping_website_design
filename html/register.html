        <div class="register-page">
        <div class="register-page-left">
            <img src="../images/1129779.jpg" alt="camping art">
         </div>
         <div class="register-page-right">
            <form>
                <div class="container">
                  <h1>Sign Up</h1>
                  <p>Please fill in this form to create an account.</p>
                  <hr>
                  
                  <label><b><i class="ri-user-line"></i>User Name</b></label>
                  <input type="text" placeholder="Enter User Name" name="name" required>
              
                  <label><b><i class="ri-mail-line"></i>Email</b></label>
                  <input type="text" placeholder="Enter Email" name="email" required>
                  
                  <label><b><i class="ri-map-pin-line"></i>Address</b></label>
                  <input type="text" placeholder="Enter Address" name="adds" required>

                  <label><b><i class="ri-lock-line"></i>Password</b></label>
                  <input type="password" placeholder="Enter Password" name="psw" required>
              
                  <label><b><i class="ri-lock-password-line"></i>Repeat Password</b></label>
                  <input type="password" placeholder="Repeat Password" name="psw-repeat" required>
                  
                  <label><b><i class="ri-map-pin-line"></i>Payment Method</b></label>
                  <p><img src="../images/payment.png" alt="payment variety pic"></p>
                  
                  <label>
                    <input type="checkbox" checked="checked" name="remember" style="margin-bottom:15px"> Remember me
                  </label>
                  
                  <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p>

                  <div class="clearfix">
                    <button type="button" class="cancelbtn">Cancel</button>
                    <button type="submit" class="signupbtn">Sign Up</button>
                  </div>
                  <div>Already have an account? <a href="Login.html">Login Here!</a></div>
    <div class="social-links">Or Login with
